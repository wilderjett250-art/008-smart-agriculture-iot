[env:esp32_c3_gateway]
platform = espressif32
board = adafruit_qtpy_esp32c3
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@2.8

; If your actual ESP32-C3 SuperMini uses a different board definition in your
; local PlatformIO installation, only adjust the `board` value. The firmware
; code and project structure can stay the same.
